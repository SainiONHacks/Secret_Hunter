name: Build APK

on:
  push:
    branches: [ "**" ]
    paths:
      - "PrivacyGuardian/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: PrivacyGuardian

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (play + full)
        run: ./gradlew assemblePlayDebug assembleFullDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: privacy-guardian-apks
          path: PrivacyGuardian/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
